name: L1nk
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    macOS: "12.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

fileGroups:
  - Assets.xcassets

targets:
  L1nk:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - L1nkApp.swift
      - Models
      - Views
      - ViewModels
      - Services
    resources:
      - Assets.xcassets
      - Assets/*.icns
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.l1nk
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_ENTITLEMENTS: L1nk.entitlements
      SWIFT_VERSION: "5.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleName: L1nk
        CFBundleExecutable: L1nk
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true

schemes:
  L1nk:
    build:
      targets:
        L1nk: all
    run:
      config: Debug
    archive:
      config: Release
