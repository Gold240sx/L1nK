name: L1nk
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    macOS: "12.0"
  developmentLanguage: en
  xcodeVersion: "15.0"

fileGroups:
  - Assets.xcassets

targets:
  L1nk:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - path: .
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
          - "build"
          - ".git"
          - "*.md"
          - "*.sh"
          - "*.py"
          - "*.yml"
          - "*.yaml"
          - "Assets"
          - "*.l1nk"
          - "VERSION"
          - "convert_icon.swift"
          - "File*.txt"
    resources:
      - Assets.xcassets
      - path: AppIcon.icns
      - path: YouTubeIcon.icns
      - path: GitHubIcon.icns
      - path: AppStoreIcon.icns
      - path: VimeoIcon.icns
      - path: LinkDocIcon.icns
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.l1nk
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_ENTITLEMENTS: L1nk.entitlements
      SWIFT_VERSION: "5.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleName: L1nk
        CFBundleExecutable: L1nk
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true

schemes:
  L1nk:
    build:
      targets:
        L1nk: all
    run:
      config: Debug
    archive:
      config: Release
